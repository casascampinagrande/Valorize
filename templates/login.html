<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Entrar - Valorize</title>
    {% load static %}

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            orange: '#f97316',
                            dark: '#111827',
                        }
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-gray-50 text-gray-800 antialiased font-sans min-h-screen flex flex-col">

<header class="bg-white border-b border-gray-200 sticky top-0 z-50 shadow-sm">
    <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
        
        <a href="{% url 'home' %}" class="flex items-center gap-2">
            <img src="{% static 'img/logo.png' %}" alt="Valorize" class="h-8 w-auto">
            <span class="text-xl font-bold text-brand-dark tracking-tight">Valorize</span>
        </a>

        <nav class="hidden md:flex gap-6 font-medium text-gray-600">
            <a href="{% url 'home' %}" class="hover:text-brand-orange transition-colors">Início</a>
            <a href="{% url 'suporte' %}" class="hover:text-brand-orange transition-colors">Suporte</a>
        </nav>

        <div class="flex gap-3">
            <a href="{% url 'registro' %}" 
               class="px-5 py-2.5 rounded-full bg-brand-orange text-white font-semibold hover:bg-orange-600 shadow-md shadow-orange-500/20 transition-all hover:-translate-y-0.5">
                Criar conta
            </a>
        </div>
    </div>
</header>

<main class="flex-grow flex items-center justify-center px-4 py-12">

    <div class="w-full max-w-md bg-white rounded-3xl shadow-xl border border-gray-100 p-8 md:p-10 transition-all">

        <div class="text-center mb-8">
            <h2 class="text-3xl font-extrabold text-gray-900 mb-2">Bem-vindo</h2>
            <p class="text-gray-500">Acesse sua conta para gerenciar seus anúncios.</p>
        </div>

        <form method="post" class="form space-y-5">
            {% csrf_token %}

            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1 uppercase tracking-wider">E-mail</label>
                <input type="email" name="email" placeholder="seu@email.com" required
                    class="w-full px-4 py-3.5 rounded-xl border border-gray-200 bg-gray-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-orange-500/20 focus:border-brand-orange transition-all text-gray-800">
            </div>

            <div>
                <div class="flex justify-between items-end mb-1">
                    <label class="text-sm font-bold text-gray-700 uppercase tracking-wider">Senha</label>
                    <a href="{% url 'esqueceu_senha' %}" class="text-xs font-semibold text-brand-orange hover:underline">
                        Esqueceu?
                    </a>
                </div>
                <input type="password" name="senha" placeholder="••••••••" required
                    class="w-full px-4 py-3.5 rounded-xl border border-gray-200 bg-gray-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-orange-500/20 focus:border-brand-orange transition-all text-gray-800">
            </div>

            <div id="login-message" class="text-center text-sm text-red-500 font-medium min-h-[20px]">
                </div>

            <div class="space-y-4 pt-2">
                <button type="submit"
                    class="w-full py-4 rounded-xl bg-brand-dark text-white font-bold hover:bg-gray-800 shadow-lg shadow-gray-900/20 transition-all hover:-translate-y-0.5">
                    Entrar
                </button>

                <div class="relative flex py-2 items-center">
                    <div class="flex-grow border-t border-gray-200"></div>
                    <span class="flex-shrink mx-4 text-gray-400 text-xs font-medium uppercase tracking-widest">ou</span>
                    <div class="flex-grow border-t border-gray-200"></div>
                </div>

                <a href="{% url 'registro' %}"
                   class="block w-full text-center py-3.5 rounded-xl border-2 border-gray-200 font-bold text-gray-600 hover:border-gray-300 hover:bg-gray-50 transition-all">
                    Cadastrar nova conta
                </a>
            </div>
        </form>

        <p class="text-center mt-8 text-sm text-gray-500">
            Problemas com o acesso? 
            <a href="{% url 'suporte' %}" class="font-bold text-gray-700 hover:text-brand-orange transition-colors">
                Fale com o suporte
            </a>
        </p>

    </div>

</main>

<footer class="py-6 text-center text-gray-400 text-xs">
    &copy; 2026 Valorize Imóveis. Todos os direitos reservados.
</footer>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="{% static 'js/session.js' %}"></script>
<script src="{% static 'js/login.js' %}"></script>

</body>
</html>
