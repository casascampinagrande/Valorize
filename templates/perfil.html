<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Meu Perfil - Valorize</title>
    {% load static %}
    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body
    class="bg-gradient-to-b from-white to-green-400 min-h-screen flex flex-col"
  >
    <!-- HEADER -->
    <header class="bg-white/70 backdrop-blur border-b border-gray-200">
      <div
        class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between"
      >
        <a href="{% url 'home' %}" class="text-xl font-bold text-gray-900">
          Valorize
        </a>

        <nav class="flex gap-6 font-semibold">
          <a
            href="{% url 'home' %}"
            class="text-gray-800 hover:text-green-700 transition"
          >
            Início
          </a>
          <a
            href="{% url 'suporte' %}"
            class="text-gray-800 hover:text-green-700 transition"
          >
            Suporte
          </a>
        </nav>

        <div class="flex gap-3">
          <a
            href="{% url 'login' %}"
            class="px-4 py-2 rounded-lg border border-gray-300 text-gray-800 font-semibold hover:bg-gray-100 transition"
          >
            Entrar
          </a>

          <a
            href="{% url 'anunciar' %}"
            class="px-4 py-2 rounded-full bg-gradient-to-r from-orange-500 to-orange-600 text-white font-semibold hover:brightness-95 transition"
          >
            Anunciar grátis
          </a>
        </div>
      </div>
    </header>

    <!-- MAIN -->
    <main class="flex-grow py-10 px-4">
      <div class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-3 gap-8">
        <!-- SIDEBAR -->
        <aside class="lg:col-span-1">
          <div class="bg-white rounded-2xl shadow p-6 space-y-6">
            <!-- Avatar -->
            <div
              class="relative group cursor-pointer"
              onclick="document.getElementById('input-foto').click()"
            >
              <img
                id="user-photo"
                src="{% static 'images/default-user.png' %}"
                class="w-20 h-20 rounded-full object-cover border-4 border-white shadow-md group-hover:opacity-75 transition"
              />
              <div
                class="absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-100 transition"
              >
                <span class="text-white text-xs bg-black/50 px-2 py-1 rounded"
                  >Alterar</span
                >
              </div>
              <input
                type="file"
                id="input-foto"
                accept="image/*"
                class="hidden"
                onchange="uploadFoto(this)"
              />

              <div>
                <h2 id="user-name" class="text-xl font-bold text-gray-800">
                  Carregando...
                </h2>
                <p
                  id="user-creci"
                  class="text-sm font-medium text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded-full inline-block"
                ></p>
              </div>
            </div>

            <!-- Info -->
            <div class="space-y-2 text-sm text-gray-600">
              <div class="flex items-center gap-2 profile-member-since">
                <span>📅</span>
                <span></span>
              </div>

              <div class="flex items-center gap-2 profile-location">
                <span>📍</span>
                <span></span>
              </div>
            </div>

            <!-- Nível -->
            <div>
              <h3 class="text-sm font-semibold text-gray-700 mb-2">
                Nível de cadastro
              </h3>

              <div class="w-full bg-gray-200 rounded-full h-2 mb-4">
                <div
                  class="bg-indigo-600 h-2 rounded-full progress-fill"
                  style="width: 0%"
                ></div>
              </div>

              <div class="space-y-2 text-sm">
                <div
                  class="flex items-center gap-2 verification-item text-gray-600"
                  data-verification="email"
                >
                  ✅ <span>Endereço de e-mail</span>
                </div>

                <div
                  class="flex items-center gap-2 verification-item text-gray-600"
                  data-verification="phone"
                >
                  ✅ <span>Número de telefone</span>
                </div>

                <div
                  class="flex items-center gap-2 verification-item text-gray-600"
                  data-verification="identity"
                >
                  ✅ <span>Identidade verificada</span>
                </div>
              </div>

              <a
                href="#"
                class="block mt-3 text-xs text-indigo-600 hover:underline"
              >
                O que é Identidade verificada?
              </a>
            </div>
          </div>
        </aside>

        <!-- CONTEÚDO PRINCIPAL -->
        <section class="lg:col-span-2 space-y-6">
          <!-- Tabs -->
          <div class="bg-white rounded-2xl shadow p-4">
            <button class="px-4 py-2 bg-indigo-600 text-white rounded-lg">
              Histórico
            </button>
          </div>

          <!-- Estatísticas -->
          <div class="bg-white rounded-2xl shadow p-6 flex items-center gap-4">
            <div class="text-indigo-600 text-3xl">📊</div>
            <div>
              <strong class="text-lg ads-count-total"></strong>
              <p class="text-sm text-gray-500">
                Publicados nos últimos 180 dias
              </p>
            </div>
          </div>

          <!-- Listagens -->
          <div class="bg-white rounded-2xl shadow p-6 space-y-6">
            <div class="flex justify-between items-center">
              <h2 class="text-xl font-semibold text-gray-800">Anúncios</h2>
              <p class="text-sm text-gray-500 listings-count"></p>
            </div>

            <!-- Filtros -->
            <div class="space-y-4">
              <input
                type="search"
                placeholder="Ex: Apartamento 2 quartos"
                class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none"
              />

              <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <select class="px-4 py-2 border rounded-lg">
                  <option>Categoria</option>
                  <option>Venda</option>
                  <option>Aluguel</option>
                </select>

                <select class="px-4 py-2 border rounded-lg">
                  <option>Localização</option>
                </select>

                <select class="px-4 py-2 border rounded-lg">
                  <option>Mais recentes</option>
                  <option>Mais antigos</option>
                  <option>Maior preço</option>
                </select>
              </div>
            </div>

            <!-- Grid de anúncios -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 ads-grid">
              <!-- Cards carregados dinamicamente -->
            </div>
          </div>
        </section>
      </div>
    </main>

    <script src="{% static 'js/profile.js' %}"></script>
    <script src="{% static 'js/session.js' %}"></script>
  </body>
</html>
